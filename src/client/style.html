<style>
  :root {
    color-scheme: dark;
    --bg: #111827;
    --surface: #1b2638;
    --text: #f0f4fa;
    --muted: #b4c4d9;
    --line: #41516b;
    --accent: #bcf47d;
    --danger: #ffb8b8;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font:
      16px/1.65 system-ui,
      sans-serif;
  }
  header,
  main,
  nav,
  footer {
    max-width: 1000px;
    margin: auto;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: center;
    padding-top: 40px;
  }
  h1 {
    font-size: 2.3rem;
    margin: 4px 0;
  }
  h2 {
    font-size: 1.7rem;
  }
  h3 {
    line-height: 1.5;
  }
  p {
    color: var(--muted);
  }
  .eyebrow {
    color: var(--accent);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
  }
  nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-top: 0;
  }
  button {
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button:hover,
  button[aria-current="page"] {
    border-color: var(--accent);
    color: var(--accent);
  }
  button:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  #submit,
  #send-talk,
  #save-settings {
    background: var(--accent);
    color: var(--bg);
  }
  article,
  .stats > div,
  .record {
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    margin: 16px 0;
  }
  .cards,
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .stats strong {
    display: block;
    font-size: 2rem;
    color: var(--accent);
  }
  label {
    display: block;
    margin: 14px 0;
  }
  input,
  select,
  textarea {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    width: 100%;
  }
  input[type="checkbox"],
  input[type="radio"] {
    width: auto;
    accent-color: var(--accent);
  }
  textarea {
    resize: vertical;
  }
  select {
    max-width: 450px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  #error {
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 16px;
    white-space: pre-wrap;
  }
  #notice {
    color: var(--accent);
  }
  .privacy {
    font-size: 0.88rem;
  }
  #feedback {
    white-space: pre-wrap;
    margin-top: 20px;
  }
  .bubble {
    max-width: 90%;
    background: var(--surface);
    padding: 14px 20px;
    border-radius: 14px;
    margin: 12px 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bubble.user {
    margin-left: auto;
    border: 1px solid var(--accent);
  }
  .record {
    overflow-wrap: anywhere;
  }
  .record p {
    white-space: pre-wrap;
  }
  footer {
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
  [hidden] {
    display: none !important;
  }
  @media (max-width: 600px) {
    header,
    main,
    nav,
    footer {
      padding: 18px;
    }
    header {
      align-items: flex-start;
      flex-direction: column;
    }
    h1 {
      font-size: 1.9rem;
    }
    .cards,
    .stats {
      grid-template-columns: 1fr;
      gap: 0;
    }
    nav button {
      padding: 8px 12px;
    }
    button {
      min-height: 44px;
    }
    .bubble {
      max-width: 100%;
    }
  }
  h1,
  h2,
  h3 {
    color: var(--text);
  }
  small {
    color: var(--muted);
  }
</style>
